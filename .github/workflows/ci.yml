# ============================================================
# GitHub Actions CI Pipeline — React Application
# ============================================================
# Trigger: runs automatically on every push to the
#          'development' branch using a self-hosted runner.
# ============================================================

name: React CI Pipeline

on:
  push:
    branches:
      - development   # Only trigger on the development branch

  # Also allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

jobs:
  build-and-test:
    name: Install → Test → Build
    runs-on: self-hosted   # Must be self-hosted (not ubuntu-latest)

    steps:
      # ----------------------------------------------------------
      # Step 1: Check out the source code onto the runner machine
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Step 2: Set up the correct Node.js version
      # ----------------------------------------------------------
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"      # Caches node_modules between runs for speed

      # ----------------------------------------------------------
      # Step 3: Install dependencies from package-lock.json
      #         'npm ci' is preferred over 'npm install' in CI
      #         because it installs exact locked versions.
      # ----------------------------------------------------------
      - name: Install dependencies
        run: npm install

      # ----------------------------------------------------------
      # Step 4: Run tests
      #         --watchAll=false : don't watch for file changes
      #         --passWithNoTests: don't fail if no tests exist yet
      # ----------------------------------------------------------
      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests

      # ----------------------------------------------------------
      # Step 5: Build the React app for production
      #         Output goes to the /build directory
      # ----------------------------------------------------------
      - name: Build React application
        run: npm run build

      # ----------------------------------------------------------
      # Step 6: Confirm the build directory was created
      # ----------------------------------------------------------
      - name: Verify build output
        run: |
          echo "Build completed. Listing output:"
          ls -lh build/
